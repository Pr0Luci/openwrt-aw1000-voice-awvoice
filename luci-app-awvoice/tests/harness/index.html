<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>phone page render check</title>
<style>
	body { font: 13px sans-serif; margin: 12px; background: #fff; color: #222; }
	.cbi-tabmenu { display: flex; list-style: none; margin: 0 0 8px; padding: 0; border-bottom: 1px solid #aaa; }
	.cbi-tabmenu li { padding: 0; } .cbi-tabmenu li a { display: block; padding: 8px 12px; color: inherit; text-decoration: none; }
	.cbi-tabmenu li.cbi-tab { border-bottom: 2px solid #1976d2; }
	.cbi-button { padding: 4px 10px; } .cbi-value { display: flex; gap: 12px; padding: 6px 0; } .cbi-value-title { width: 180px; flex: none; }
	.modal { position: fixed; inset: 20% 20% auto; background: #fff; border: 1px solid #888; padding: 12px; z-index: 10; }
	#bar { margin-bottom: 8px; }
	@media (max-width: 700px) { .cbi-value { display: block; } .cbi-value-title { width: auto; } }
</style>
</head>
<body>
<div id="bar">fixture: <a href="?state=idle">idle</a> <a href="?state=offhook">offhook</a> <a href="?state=ring">ring</a> <a href="?state=ring_anon">ring (withheld)</a>
	<a href="?state=dial">dialling</a> <a href="?state=call">call</a> <a href="?state=noservice">noservice</a> <a href="?state=down">down</a> |
	<a href="?state=idle&m5=1">idle + later features</a></div>
<div id="view"></div>
<script src="loader.js"></script>
<script>
	loadView('view.awvoice.phone').then(function(v) {
		return Promise.resolve(v.load()).then(function(data) { document.getElementById('view').appendChild(v.render(data)); });
	}).catch(function(e) { document.getElementById('view').textContent = 'ERROR: ' + (e.stack || e); console.error(e); });
</script>
</body>
</html>
